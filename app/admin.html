<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — CAETANO</title><link rel="stylesheet" href="css/style.css"><script src="js/firebase-config.js"></script><script src="js/core.js"></script><script src="js/page.js"></script></head><body><script>
document.addEventListener('DOMContentLoaded',()=>{Caetano.requireRole(['admin','superadmin']); const sales=Caetano.col('sales').all(), fin=Caetano.col('finance').all(), lots=Caetano.col('lots').all(), orders=Caetano.col('orders').all(); const receber=fin.filter(x=>x.tipo==='receber').reduce((s,x)=>s+Caetano.num(x.valor),0); const pagar=fin.filter(x=>x.tipo==='pagar').reduce((s,x)=>s+Caetano.num(x.valor),0); CaetanoPage.shell('admin','Admin — Gestão Caetano',`<div class="grid cols-4"><div class="card kpi ok"><small>Vendas registradas</small><strong>${sales.length}</strong></div><div class="card kpi warn"><small>Contas a pagar</small><strong>${Caetano.money(pagar)}</strong></div><div class="card kpi ok"><small>Receitas</small><strong>${Caetano.money(receber)}</strong></div><div class="card kpi"><small>Lotes em estoque</small><strong>${lots.length}</strong></div></div><div class="grid cols-2"><div class="card"><div class="card-h"><h3>Financeiro</h3></div><div class="card-b"><div class="table-wrap"><table class="table"><thead><tr><th>Tipo</th><th>Origem</th><th>Valor</th><th>Vencimento</th><th>Status</th></tr></thead><tbody id="finRows"></tbody></table></div></div></div><div class="card"><div class="card-h"><h3>Encomendas</h3></div><div class="card-b"><div class="table-wrap"><table class="table"><thead><tr><th>Cliente</th><th>Pedido</th><th>Retirada</th><th>Status</th></tr></thead><tbody id="ordRows"></tbody></table></div></div></div></div>`); Caetano.renderRows(document.getElementById('finRows'),fin.slice(-25).reverse(),[{label:'Tipo',key:'tipo'},{label:'Origem',key:'origem'},{label:'Valor',html:r=>Caetano.money(r.valor)},{label:'Vencimento',html:r=>Caetano.fmtDate(r.vencimento)},{label:'Status',key:'status'}]); Caetano.renderRows(document.getElementById('ordRows'),orders.slice(-25).reverse(),[{label:'Cliente',key:'cliente'},{label:'Pedido',key:'descricao'},{label:'Retirada',html:r=>Caetano.fmtDate(r.retirada)},{label:'Status',key:'status'}]);});</script></body></html>
