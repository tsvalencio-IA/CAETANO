<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cozinha — Caetano</title><link rel="stylesheet" href="css/style.css"><script src="js/firebase-config.js"></script><script src="js/core.js"></script></head><body><div class="wrap"><div class="screen-title"><div><h1>Cozinha / Rotisseria</h1><p class="muted">Produção do dia, encomendas, validade e status.</p></div><button class="btn" onclick="Caetano.logout()">Sair</button></div><div class="grid"><div class="card span-4"><h2>Nova produção</h2><div class="field"><label>Produto</label><input id="prod" placeholder="Frango assado, costela, kit churrasco..."></div><div class="field"><label>Quantidade</label><input id="qtd" inputmode="decimal"></div><div class="field"><label>Validade</label><input id="val" type="date"></div><button class="btn primary" onclick="salvar()">Registrar produção</button></div><div class="card span-8"><h2>Produção</h2><div id="lista"></div></div></div></div><div id="toast" class="toast"></div><script>const S=Caetano.requireRole(['cozinha','admin']);const tid=S?.tenantId||'caetano';function salvar(){Caetano.upsert('producao',tid,{produto:prod.value,quantidade:Caetano.num(qtd.value),validade:val.value,status:'pronto',data:Caetano.isoToday()});Caetano.toast('Produção registrada.');render()}function render(){let ps=Caetano.list('producao',tid);lista.innerHTML='<div class="table-wrap"><table><tr><th>Produto</th><th>Qtd</th><th>Validade</th><th>Status</th></tr>'+ps.map(p=>`<tr><td>${p.produto}</td><td>${p.quantidade}</td><td>${Caetano.brDate(p.validade)}</td><td>${p.status}</td></tr>`).join('')+'</table></div>'}render()</script></body></html>
