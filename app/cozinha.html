<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rotisseria — CAETANO</title><link rel="stylesheet" href="css/style.css"><script src="js/firebase-config.js"></script><script src="js/core.js"></script><script src="js/page.js"></script></head><body><script>
document.addEventListener('DOMContentLoaded',()=>{Caetano.requireRole(['cozinha','admin','superadmin']); CaetanoPage.shell('cozinha','Cozinha / Rotisseria',`<div class="grid cols-2"><div class="card"><div class="card-h"><h3>Produção do dia</h3><button class="btn small" id="addProd">Registrar produção</button></div><div class="card-b form"><input id="prodNome" placeholder="Ex.: Frango assado"><input id="prodQtd" placeholder="Quantidade / peso produzido"><input id="prodVal" type="date"><textarea id="prodObs" placeholder="Ingredientes, lote, observações"></textarea></div></div><div class="card"><div class="card-h"><h3>Encomenda</h3><button class="btn ok small" id="addOrder">Criar encomenda</button></div><div class="card-b form"><input id="cli" placeholder="Cliente"><input id="desc" placeholder="Produto/encomenda"><input id="ret" type="datetime-local"><select id="st"><option>pendente</option><option>em_preparo</option><option>pronto</option><option>entregue</option></select></div></div></div><div class="card"><div class="card-h"><h3>Lista de encomendas</h3></div><div class="card-b"><table class="table"><thead><tr><th>Cliente</th><th>Pedido</th><th>Retirada</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></div>`);function refresh(){Caetano.renderRows(rows,Caetano.col('orders').all().reverse(),[{label:'Cliente',key:'cliente'},{label:'Pedido',key:'descricao'},{label:'Retirada',key:'retirada'},{label:'Status',key:'status'}])} addProd.onclick=()=>{Caetano.col('lots').add({tipo:'producao',nome:prodNome.value,quantidade:prodQtd.value,validade:prodVal.value,obs:prodObs.value,tenantId:Caetano.currentTenant(),createdAt:Caetano.now()});Caetano.toast('Produção registrada.');}; addOrder.onclick=()=>{Caetano.col('orders').add({cliente:cli.value,descricao:desc.value,retirada:ret.value,status:st.value,tenantId:Caetano.currentTenant(),createdAt:Caetano.now()});refresh();};refresh();});</script></body></html>
