<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cozinha Caetano</title><link rel="stylesheet" href="css/style.css"><script src="js/firebase-config.js"></script><script src="js/core.js"></script></head><body><div class="wrap"><div class="top"><div class="brand"><div class="logo">R</div><div><h1>Cozinha / Rotisseria</h1><p>Produção padronizada, encomendas, validade e baixa de insumos.</p></div></div><button class="btn bad" onclick="Caetano.logout()">Sair</button></div><div class="grid"><div class="card span-6"><h2>Nova produção</h2><input id="prodNome" placeholder="Ex.: Frango assado, kit churrasco, carne temperada"><div class="row"><input id="prodQtd" placeholder="Qtd produzida"><input id="prodVal" type="datetime-local"></div><textarea id="prodObs" placeholder="Ingredientes, padrão de preparo, observação"></textarea><button class="btn primary" onclick="saveProd()">Registrar produção</button></div><div class="card span-6"><h2>Encomendas</h2><input id="pedCli" placeholder="Cliente"><input id="pedDesc" placeholder="Pedido/encomenda"><div class="row"><input id="pedData" type="datetime-local"><select id="pedStatus"><option>pendente</option><option>em_preparo</option><option>pronto</option><option>entregue</option></select></div><button class="btn primary" onclick="savePed()">Salvar encomenda</button></div><div class="card span-12"><h2>Fila operacional</h2><table><tbody id="tb"></tbody></table></div></div><div class="footer">Powered by thIAguinho Soluções</div></div><script>Caetano.requireRole(['admin','cozinha']);function saveProd(){Caetano.upsert('producao',{nome:prodNome.value,qtd:Caetano.n(prodQtd.value),validade:prodVal.value,obs:prodObs.value,status:'produzido'});render()}function savePed(){Caetano.upsert('pedidos',{cliente:pedCli.value,descricao:pedDesc.value,retirada:pedData.value,status:pedStatus.value});render()}function render(){const ps=Caetano.byTenant('producao').map(p=>`<tr><td>Produção</td><td>${p.nome}</td><td>${p.qtd}</td><td>${p.validade||''}</td><td>${p.status}</td></tr>`).join('');const pd=Caetano.byTenant('pedidos').map(p=>`<tr><td>Encomenda</td><td>${p.cliente}</td><td>${p.descricao}</td><td>${p.retirada||''}</td><td>${p.status}</td></tr>`).join('');tb.innerHTML=ps+pd}render()</script><div id="toast" class="toast"></div></body></html>
