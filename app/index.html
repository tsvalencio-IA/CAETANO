<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAETANO Carnes & Rotisseria</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="css/style.css"><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/core.js"></script></head><body><div class="client-shell"><div class="login-card"><div class="brand" style="border:0;margin:0 0 15px;padding:0"><div class="brand-mark">C</div><div><h1>CAETANO</h1><small>Carnes & Rotisseria</small></div></div><h2>Acesso ao sistema</h2><p style="color:var(--muted)">Escolha o perfil operacional.</p><div class="grid" style="margin:16px 0"><button class="btn" data-role="admin">Admin</button><button class="btn" data-role="pdv">PDV</button><button class="btn" data-role="cozinha">Cozinha</button><button class="btn" data-role="estoque">Estoque</button><a class="btn secondary" href="cliente.html">Cliente</a></div><div class="form"><label>E-mail</label><input id="email" type="email" inputmode="email" autocomplete="username email" autocapitalize="none" placeholder="usuario@caetano.com.br"><label>Senha</label><input id="senha" type="password" autocomplete="current-password" placeholder="Senha"><button class="btn gold" id="entrar">Entrar</button></div></div></div><div class="powered" id="powered">Powered by thIAguinho Soluções</div><script>let role='admin',clicks=0;document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;document.querySelectorAll('[data-role]').forEach(x=>x.classList.remove('gold'));b.classList.add('gold')});email.value=localStorage.getItem('caetano_last_email')||'';entrar.onclick=async()=>{try{const u=await Caetano.login(email.value,senha.value,role);location.href=role==='admin'?'admin.html':role+'.html'}catch(e){Caetano.toast('Erro no login: '+e.message)}};powered.onclick=()=>{clicks++;if(clicks>=5){const p=prompt('Acesso restrito'); if(p==='*177') location.href='superadmin.html'; clicks=0;}};</script></body></html>
