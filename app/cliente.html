<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cliente — Caetano</title><link rel="stylesheet" href="css/style.css"><script src="js/firebase-config.js"></script><script src="js/core.js"></script></head><body><div class="wrap"><div class="screen-title"><div><h1>Portal do Cliente</h1><p class="muted">Somente compras, pedidos, encomendas e comprovantes próprios.</p></div><button class="btn" onclick="Caetano.logout()">Sair</button></div><div class="grid"><div class="card span-12"><h2>Minhas compras</h2><div id="compras"></div></div><div class="card span-12"><h2>Minhas encomendas</h2><div id="pedidos"></div></div></div></div><div id="toast" class="toast"></div><script>const S=Caetano.requireRole(['cliente']);const tid=S?.tenantId||'caetano';function render(){let vs=Caetano.list('vendas',tid).filter(v=>!S.clienteId||String(v.clienteId||'')===String(S.clienteId)||String(v.cliente||'').toLowerCase().includes(String(S.nome||'').toLowerCase()));compras.innerHTML=vs.length?'<table><tr><th>Data</th><th>Resumo</th><th>Total</th></tr>'+vs.map(v=>`<tr><td>${Caetano.brDate(v.data)}</td><td>${(v.itens||[]).map(i=>i.nome).join(', ')}</td><td>${Caetano.money(v.total)}</td></tr>`).join('')+'</table>':'<p class="muted">Nenhuma compra vinculada.</p>';let ps=Caetano.list('pedidos',tid).filter(p=>p.clienteId===S.clienteId);pedidos.innerHTML=ps.length?ps.map(p=>`<div class="card"><b>${p.titulo}</b><br><span class="muted">${p.status} · ${Caetano.brDate(p.dataRetirada)}</span></div>`).join(''):'<p class="muted">Nenhuma encomenda.</p>'}render()</script></body></html>
