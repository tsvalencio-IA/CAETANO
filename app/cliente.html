<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cliente — CAETANO</title><link rel="stylesheet" href="css/style.css"><script src="js/firebase-config.js"></script><script src="js/core.js"></script></head><body><div class="client-shell"><div class="login-card"><div class="brand" style="border:0;margin:0 0 15px;padding:0"><div class="brand-mark">C</div><div><h1>CAETANO</h1><small>Minhas compras</small></div></div><p style="color:var(--muted)">Área do cliente: compras, encomendas e comprovantes. Sem dashboard interno.</p><input id="tel" placeholder="Telefone/WhatsApp"><button class="btn" id="buscar">Consultar</button><div id="out" style="margin-top:16px"></div></div></div><div class="powered">Powered by thIAguinho Soluções</div><script>buscar.onclick=()=>{const q=Caetano.onlyDigits(tel.value); const vendas=Caetano.col('sales').all().filter(v=>Caetano.onlyDigits(v.customer?.telefone||'')===q||!q); const pedidos=Caetano.col('orders').all().filter(o=>Caetano.onlyDigits(o.telefone||'')===q||!q); out.innerHTML=`<h3>Compras</h3>${vendas.slice(-10).map(v=>`<div class="card" style="padding:10px;margin:8px 0">${Caetano.fmtDate(v.createdAt)} · ${Caetano.money(v.total)} · ${v.status}</div>`).join('')||'<p>Nenhuma compra localizada.</p>'}<h3>Encomendas</h3>${pedidos.slice(-10).map(o=>`<div class="card" style="padding:10px;margin:8px 0">${Caetano.escapeHtml(o.descricao)} · ${o.status} · ${o.retirada||''}</div>`).join('')||'<p>Nenhuma encomenda localizada.</p>'}`}</script></body></html>
