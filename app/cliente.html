<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cliente Caetano</title><link rel="stylesheet" href="css/style.css"><script src="js/firebase-config.js"></script><script src="js/core.js"></script></head><body><div class="wrap"><div class="top"><div class="brand"><div class="logo">C</div><div><h1>Portal do Cliente</h1><p>Compras, encomendas e fidelidade. Sem dashboard interno.</p></div></div><button class="btn bad" onclick="Caetano.logout()">Sair</button></div><div class="grid"><div class="card span-6"><h2>Meus pedidos</h2><table><tbody id="ped"></tbody></table></div><div class="card span-6"><h2>Minhas compras</h2><table><tbody id="vend"></tbody></table></div></div><div class="footer">Powered by thIAguinho Soluções</div></div><script>const s=Caetano.requireRole(['cliente']);function render(){ped.innerHTML=Caetano.byTenant('pedidos').filter(p=>p.clienteId===s.clienteId).map(p=>`<tr><td>${p.descricao}</td><td>${p.status}</td></tr>`).join('')||'<tr><td>Nenhum pedido.</td></tr>';vend.innerHTML=Caetano.byTenant('vendas').filter(v=>v.clienteId===s.clienteId).map(v=>`<tr><td>${new Date(v.criadoEm).toLocaleDateString('pt-BR')}</td><td>${Caetano.br(v.total)}</td></tr>`).join('')||'<tr><td>Nenhuma compra vinculada.</td></tr>'}render()</script></body></html>
