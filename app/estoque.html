<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estoque Caetano</title><link rel="stylesheet" href="css/style.css"><script src="js/firebase-config.js"></script><script src="js/core.js"></script></head><body><div class="wrap"><div class="top"><div class="brand"><div class="logo">E</div><div><h1>Estoque / Compras</h1><p>NF-e XML, entrada manual, lotes, validade, etiquetas e vínculos.</p></div></div><button class="btn bad" onclick="Caetano.logout()">Sair</button></div><div class="grid"><div class="card span-12"><h2>Entrada por XML NF-e</h2><input type="file" id="xml" accept=".xml,text/xml"><div id="nfeBox"></div></div><div class="card span-6"><h2>Entrada simples sem NF</h2><div class="row"><input id="smCodigo" placeholder="Código"><input id="smNome" placeholder="Produto"></div><div class="row3"><input id="smQtd" placeholder="Qtd"><input id="smCusto" placeholder="Custo unitário"><input id="smVal" type="date"></div><select id="smDestino"><option value="estoque">Estoque</option><option value="uso_interno">Uso interno</option><option value="garantia">Garantia</option><option value="devolucao">Devolução</option></select><button class="btn primary" onclick="entradaManual()">Registrar entrada</button></div><div class="card span-6"><h2>Estoque atual</h2><table><tbody id="tbEst"></tbody></table></div></div><div class="footer">Powered by thIAguinho Soluções</div></div><script>Caetano.requireRole(['admin','estoque']);let nfeAtual=null;xml.onchange=async()=>{const f=xml.files[0];if(!f)return;const text=await f.text();nfeAtual=Caetano.parseNFe(text);renderNFe()};function renderNFe(){const nfe=nfeAtual;nfeBox.innerHTML=`<h3>NF ${nfe.numero} — ${nfe.emitente.nome}</h3><p><b>Chave:</b> ${nfe.chave}<br><b>Total:</b> ${Caetano.br(nfe.totais.vNF)} • <b>Duplicatas:</b> ${nfe.duplicatas.length}</p><div class="scroll"><table><thead><tr><th>Cód. Forn.</th><th>Cód./OEM</th><th>Descrição</th><th>Marca</th><th>NCM/CFOP/CEST</th><th>Qtd</th><th>Custo</th><th>Destino</th></tr></thead><tbody>${nfe.itens.map((i,idx)=>`<tr><td>${i.cProd}</td><td>${i.codigoComercial||'-'}</td><td><b>${i.descricao}</b><br><small>EAN ${i.cEAN}</small></td><td>${i.marca||'-'}</td><td>NCM ${i.ncm}<br>CFOP ${i.cfop}<br>CEST ${i.cest||'-'}</td><td>${i.qCom} ${i.uCom}</td><td>${Caetano.br(i.vUnCom)}<br><small>Total ${Caetano.br(i.vLiq||i.vProd)}</small></td><td><select data-dest="${idx}"><option value="estoque">Estoque</option><option value="os">Vincular O.S.</option><option value="placa">Separar por placa</option><option value="garantia">Garantia</option><option value="devolucao">Devolução</option><option value="uso_interno">Uso interno</option><option value="outro">Outro</option></select><input data-vinc="${idx}" placeholder="Placa/O.S./Obs"></td></tr>`).join('')}</tbody></table></div><button class="btn primary" onclick="salvarNFe()">Salvar NF, estoque e boletos</button>`}
function salvarNFe(){if(!nfeAtual)return;document.querySelectorAll('[data-dest]').forEach(sel=>{nfeAtual.itens[sel.dataset.dest].destino=sel.value});document.querySelectorAll('[data-vinc]').forEach(inp=>{nfeAtual.itens[inp.dataset.vinc].vinculo=inp.value});const nf=Caetano.upsert('compras',{tipo:'nfe',...nfeAtual});nfeAtual.itens.forEach(i=>{if(i.destino==='estoque'||i.destino==='os'||i.destino==='placa')Caetano.upsert('estoque',{origem:'nfe',nfeId:nf.id,chave:nfeAtual.chave,fornecedor:nfeAtual.emitente.nome,codigo:i.cProd,codigoComercial:i.codigoComercial,nome:i.descricao,marca:i.marca,ean:i.cEAN,ncm:i.ncm,cest:i.cest,cfop:i.cfop,qtdEntrada:i.qCom,qtdAtual:i.qCom,custo:i.vUnCom,total:i.vLiq||i.vProd,destino:i.destino,vinculo:i.vinculo,validade:'',lote:nfeAtual.numero})});Caetano.addFinanceiroFromNFe(nfeAtual);nfeAtual=null;nfeBox.innerHTML='';render();Caetano.toast('NF importada com financeiro e estoque')}function entradaManual(){Caetano.upsert('estoque',{origem:'manual',codigo:smCodigo.value,nome:smNome.value,qtdEntrada:Caetano.n(smQtd.value),qtdAtual:Caetano.n(smQtd.value),custo:Caetano.n(smCusto.value),validade:smVal.value,destino:smDestino.value});render()}function render(){tbEst.innerHTML=Caetano.byTenant('estoque').map(e=>`<tr><td><b>${e.nome}</b><br><small>${e.codigo||''} ${e.codigoComercial||''}</small></td><td>${e.qtdAtual}</td><td>${Caetano.br(e.custo)}</td><td>${e.destino||'estoque'}<br><small>${e.vinculo||''}</small></td></tr>`).join('')}render()</script><div id="toast" class="toast"></div></body></html>
