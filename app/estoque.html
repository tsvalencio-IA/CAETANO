<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estoque / NF-e — CAETANO</title><link rel="stylesheet" href="css/style.css"><script src="js/firebase-config.js"></script><script src="js/core.js"></script><script src="js/page.js"></script><script src="js/nfe.js"></script><script src="js/etiquetas.js"></script></head><body><script>
document.addEventListener('DOMContentLoaded',()=>{Caetano.requireRole(['estoque','admin','superadmin']); let parsed=null; CaetanoPage.shell('estoque','Estoque / Compras / NF-e',`<div class="tabs"><button class="tab active" data-tab="xml">Importar XML</button><button class="tab" data-tab="prod">Produtos</button><button class="tab" data-tab="etq">Etiquetas</button></div><div class="panel active" id="p-xml"><div class="card"><div class="card-h"><h3>Entrada de NF-e XML</h3><input type="file" id="xmlFile" accept=".xml,text/xml"></div><div class="card-b"><div id="nfeResumo"></div><div class="table-wrap"><table class="table"><thead><tr><th>Cód. Forn.</th><th>OEM/Cód.</th><th>Descrição</th><th>Marca</th><th>NCM</th><th>CFOP</th><th>Qtd</th><th>Custo</th><th>Destino</th></tr></thead><tbody id="itens"></tbody></table></div><button class="btn ok" id="salvarNfe">Salvar entrada fiscal</button></div></div></div><div class="panel" id="p-prod"><div class="card"><div class="card-h"><h3>Produtos / Lotes</h3><input id="busca" placeholder="Buscar código, produto, NCM, fornecedor"></div><div class="card-b"><table class="table"><thead><tr><th>Código</th><th>Produto</th><th>Marca</th><th>NCM</th><th>Qtd</th><th>Custo</th><th>Destino</th></tr></thead><tbody id="lotsRows"></tbody></table></div></div></div><div class="panel" id="p-etq"><div class="card"><div class="card-h"><h3>Gerar etiqueta</h3><button class="btn small" onclick="window.print()">Imprimir</button></div><div class="card-b form"><input id="etqCodigo" placeholder="Código do produto"><input id="etqNome" placeholder="Nome"><input id="etqPreco" placeholder="Preço"><input id="etqPeso" placeholder="Peso/Qtd"><input id="etqVal" placeholder="Validade"><button class="btn" id="gerarEtq">Gerar prévia</button><div class="print-area" id="printArea"></div><div id="etqPrev"></div></div></div></div>`); document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('p-'+b.dataset.tab).classList.add('active')}); function renderLots(){const q=(busca?.value||'').toLowerCase(); const rows=Caetano.col('lots').all().filter(l=>[l.codigoFornecedor,l.descricao,l.marca,l.ncm,l.fornecedor,l.placa].join(' ').toLowerCase().includes(q)); Caetano.renderRows(lotsRows,rows,[{label:'Código',key:'codigoFornecedor'},{label:'Produto',key:'descricao'},{label:'Marca',key:'marca'},{label:'NCM',key:'ncm'},{label:'Qtd',key:'quantidade'},{label:'Custo',html:r=>Caetano.money(r.custoUnitario)},{label:'Destino',html:r=>`${r.destino||''} ${r.placa?('· '+r.placa):''}`}])} busca.oninput=renderLots; xmlFile.onchange=async()=>{const text=await xmlFile.files[0].text(); parsed=CaetanoNFe.parseXml(text); nfeResumo.innerHTML=`<div class="grid cols-4"><div class="card kpi"><small>Fornecedor</small><strong style="font-size:16px">${Caetano.escapeHtml(parsed.nota.fornecedor.nome)}</strong></div><div class="card kpi"><small>NF</small><strong>${parsed.nota.numero}</strong></div><div class="card kpi"><small>Total</small><strong>${Caetano.money(parsed.nota.valorNF)}</strong></div><div class="card kpi"><small>Duplicatas</small><strong>${parsed.duplicatas.length}</strong></div></div>`; const osList=Caetano.col('orders').all(); itens.innerHTML=parsed.itens.map((it,i)=>`<tr><td>${it.codigoFornecedor}</td><td><input value="${Caetano.escapeHtml(it.codigoComercial)}" data-i="${i}" data-k="codigoComercial"></td><td><input value="${Caetano.escapeHtml(it.descricao)}" data-i="${i}" data-k="descricao"></td><td><input value="${Caetano.escapeHtml(it.marca)}" data-i="${i}" data-k="marca"></td><td>${it.ncm}</td><td>${it.cfop}</td><td>${it.qtd}</td><td>${Caetano.money(it.valorUnitario)}</td><td><select data-i="${i}" data-k="destino"><option value="estoque">Estoque</option><option value="os">Vincular O.S.</option><option value="placa">Separar por placa</option><option value="garantia">Garantia</option><option value="devolucao">Devolução</option><option value="uso_interno">Uso interno</option><option value="outro">Outro</option></select><input data-i="${i}" data-k="placa" placeholder="Placa/O.S. opcional"><select data-i="${i}" data-k="osId"><option value="">Selecionar O.S.</option>${osList.map(o=>`<option value="${o.id}">${o.placa||''} · ${o.descricao||o.cliente||''} · ${o.status||''} · ${Caetano.fmtDate(o.createdAt)}</option>`).join('')}</select></td></tr>`).join(''); document.querySelectorAll('[data-i]').forEach(el=>el.onchange=()=>{parsed.itens[+el.dataset.i][el.dataset.k]=el.value});}; salvarNfe.onclick=()=>{if(!parsed)return Caetano.toast('Importe um XML.'); CaetanoNFe.salvarImportacao(parsed); parsed=null; nfeResumo.innerHTML=''; itens.innerHTML=''; xmlFile.value=''; renderLots(); Caetano.toast('NF-e importada com espelho fiscal e financeiro.');}; gerarEtq.onclick=()=>{const prod={id:etqCodigo.value,codigoComercial:etqCodigo.value,nome:etqNome.value,preco:Caetano.num(etqPreco.value),validade:etqVal.value}; const html=CaetanoEtiquetas.etiqueta(prod,etqPeso.value,prod.preco); etqPrev.innerHTML=html; printArea.innerHTML=html;}; renderLots();});</script></body></html>
