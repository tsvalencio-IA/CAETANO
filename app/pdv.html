<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDV Caetano</title><link rel="stylesheet" href="css/style.css"><script src="js/firebase-config.js"></script><script src="js/core.js"></script></head><body><div class="wrap"><div class="top"><div class="brand"><div class="logo">P</div><div><h1>PDV / Caixa</h1><p>Venda por código, etiqueta, peso, unidade e encomenda.</p></div></div><button class="btn bad" onclick="Caetano.logout()">Sair</button></div><div class="grid"><div class="card span-8"><h2>Venda</h2><input id="busca" placeholder="Leia etiqueta/código ou digite produto" autofocus onkeydown="if(event.key==='Enter')addByCode()"><div class="scroll"><table><thead><tr><th>Item</th><th>Qtd/Peso</th><th>Unitário</th><th>Total</th></tr></thead><tbody id="cart"></tbody></table></div><div class="kpi"><span>Total</span><b id="total">R$ 0</b></div><div class="actions"><button class="btn" onclick="addByCode()">Adicionar</button><button class="btn ok" onclick="finalizar()">Finalizar venda</button><button class="btn bad" onclick="limpar()">Limpar</button></div></div><div class="card span-4"><h2>Produtos</h2><div id="produtos"></div></div></div><div class="footer">Powered by thIAguinho Soluções</div></div><script>Caetano.requireRole(['admin','pdv']);let itens=[];function produtosFiltrados(){return Caetano.byTenant('produtos').filter(p=>p.ativo)}function render(){produtos.innerHTML=produtosFiltrados().map(p=>`<button class="btn" style="margin:4px" onclick="add('${p.id}')">${p.nome}<br><small>${Caetano.br(p.precoVenda)} / ${p.tipoVenda}</small></button>`).join('');cart.innerHTML=itens.map(i=>`<tr><td>${i.nome}</td><td><input value="${i.qtd}" onchange="i.qtd=Caetano.n(this.value);render()"></td><td>${Caetano.br(i.preco)}</td><td>${Caetano.br(i.qtd*i.preco)}</td></tr>`).join('');total.textContent=Caetano.br(itens.reduce((s,i)=>s+i.qtd*i.preco,0))}function add(id){const p=Caetano.list('produtos').find(x=>x.id===id);if(!p)return;let qtd=p.tipoVenda==='kg'?Number(prompt('Peso em kg','1')||1):1;itens.push({produtoId:p.id,codigo:p.codigo,nome:p.nome,qtd,preco:p.precoVenda,tipo:p.tipoVenda});render()}function addByCode(){const q=busca.value.trim().toLowerCase();const p=produtosFiltrados().find(x=>String(x.codigo||'').toLowerCase()===q||String(x.ean||'').toLowerCase()===q||String(x.nome).toLowerCase().includes(q));if(p)add(p.id);else Caetano.toast('Produto não encontrado');busca.value=''}function finalizar(){if(!itens.length)return;const total=itens.reduce((s,i)=>s+i.qtd*i.preco,0);Caetano.upsert('vendas',{itens,total,status:'finalizada',forma:'balcao'});Caetano.upsert('financeiro',{tipo:'receita',origem:'pdv',descricao:'Venda PDV',valor:total,status:'recebido',vencimento:new Date().toISOString().slice(0,10)});limpar();Caetano.toast('Venda finalizada')}function limpar(){itens=[];render()}render()</script><div id="toast" class="toast"></div></body></html>
