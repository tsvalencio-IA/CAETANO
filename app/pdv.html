<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDV — Caetano</title><link rel="stylesheet" href="css/style.css"><script src="js/firebase-config.js"></script><script src="js/core.js"></script></head><body><div class="wrap"><div class="screen-title"><div><h1>PDV / Caixa</h1><p class="muted">Venda por código, etiqueta, kg ou unidade. Leitor USB/Bluetooth funciona digitando no campo de código.</p></div><button class="btn" onclick="Caetano.logout()">Sair</button></div><div class="grid"><div class="card span-5"><h2>Venda</h2><div class="field"><label>Código / etiqueta / busca</label><input id="busca" autofocus placeholder="Passe o leitor ou digite o código"></div><div class="actions"><button class="btn primary" onclick="adicionarPorCodigo()">Adicionar</button><button class="btn" onclick="limparVenda()">Limpar</button></div><div id="resultadoBusca"></div></div><div class="card span-7"><h2>Carrinho</h2><div id="carrinho"></div><div class="field"><label>Cliente</label><input id="cliente" placeholder="Cliente avulso ou nome"></div><div class="field"><label>Forma de pagamento</label><select id="pag"><option>Dinheiro</option><option>PIX</option><option>Débito</option><option>Crédito</option><option>Boleto</option></select></div><button class="btn primary" onclick="finalizar()">Finalizar venda</button></div></div></div><div id="toast" class="toast"></div><script>const S=Caetano.requireRole(['pdv','admin']);const tid=S?.tenantId||'caetano';let itens=[];busca.addEventListener('keydown',e=>{if(e.key==='Enter')adicionarPorCodigo()});function adicionarPorCodigo(){let q=busca.value.trim().toLowerCase();let p=Caetano.list('produtos',tid).find(x=>String(x.codigo).toLowerCase()===q||String(x.ean).toLowerCase()===q||String(x.nome).toLowerCase().includes(q));if(!p){resultadoBusca.innerHTML='<p class="status bad">Produto não encontrado.</p>';return}let qtd=prompt('Quantidade/peso',p.tipoVenda==='kg'?'1.000':'1')||'1';let valor=p.tipoVenda==='kg'?Number(p.precoKg||0):Number(p.precoUn||0);itens.push({produtoId:p.id,codigo:p.codigo,nome:p.nome,qtd:Caetano.num(qtd),valorUnitario:valor,total:Caetano.num(qtd)*valor,tipoVenda:p.tipoVenda});busca.value='';resultadoBusca.innerHTML='';render()}function render(){carrinho.innerHTML='<table><tr><th>Item</th><th>Qtd</th><th>Total</th></tr>'+itens.map(i=>`<tr><td>${i.codigo} - ${i.nome}</td><td>${i.qtd}</td><td>${Caetano.money(i.total)}</td></tr>`).join('')+'</table><h2>Total: '+Caetano.money(itens.reduce((s,i)=>s+i.total,0))+'</h2>'}function limparVenda(){itens=[];render()}function finalizar(){if(!itens.length)return Caetano.toast('Sem itens.');let v={data:Caetano.isoToday(),cliente:cliente.value||'Cliente avulso',itens,total:itens.reduce((s,i)=>s+i.total,0),formaPagamento:pag.value,status:'finalizada'};Caetano.upsert('vendas',tid,v);Caetano.upsert('financeiro',tid,{tipo:'receita',categoria:'Venda balcão',descricao:'Venda PDV '+(v.cliente||''),valor:v.total,vencimento:Caetano.isoToday(),status:'recebido',formaPagamento:pag.value});Caetano.toast('Venda finalizada.');limparVenda()}</script></body></html>
