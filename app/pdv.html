<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDV — CAETANO</title><link rel="stylesheet" href="css/style.css"><script src="js/firebase-config.js"></script><script src="js/core.js"></script><script src="js/page.js"></script><script src="js/pdv.js"></script></head><body><script>
document.addEventListener('DOMContentLoaded',()=>{Caetano.requireRole(['pdv','admin','superadmin']); let cart=[]; CaetanoPage.shell('pdv','PDV / Balcão',`<div class="grid cols-2"><div class="card"><div class="card-h"><h3>Leitura / busca</h3></div><div class="card-b form"><label>Código, etiqueta, EAN ou nome</label><input id="q" autofocus placeholder="Leia no scanner ou digite"><div id="results"></div></div></div><div class="card"><div class="card-h"><h3>Carrinho</h3><button class="btn ok small" id="finalizar">Finalizar venda</button></div><div class="card-b"><table class="table"><thead><tr><th>Item</th><th>Qtd/Peso</th><th>Valor</th><th></th></tr></thead><tbody id="cartRows"></tbody></table><h2 id="total">R$ 0,00</h2><div class="row"><input id="cliente" placeholder="Cliente (opcional)"><select id="forma"><option>dinheiro</option><option>pix</option><option>cartao_debito</option><option>cartao_credito</option><option>fiado</option></select></div></div></div></div>`); function draw(){Caetano.renderRows(cartRows,cart,[{label:'Item',html:r=>Caetano.escapeHtml(r.nome)},{label:'Qtd/Peso',html:r=>`<input value="${r.qtd}" data-id="${r.id}" class="qtd">`},{label:'Valor',html:r=>Caetano.money(r.total)},{label:'',html:r=>`<button class="btn bad small" data-del="${r.id}">x</button>`}]); total.textContent=Caetano.money(cart.reduce((s,i)=>s+Caetano.num(i.total),0)); document.querySelectorAll('.qtd').forEach(i=>i.onchange=()=>{const it=cart.find(x=>x.id===i.dataset.id); it.qtd=Caetano.num(i.value); it.total=it.qtd*it.preco; draw()}); document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{cart=cart.filter(x=>x.id!==b.dataset.del);draw()})} q.oninput=()=>{const rows=CaetanoPDV.productSearch(q.value).slice(0,12); results.innerHTML=rows.map(p=>`<button class="btn secondary" style="margin:5px 0;justify-content:flex-start" data-p="${p.id}">${Caetano.escapeHtml(p.nome)} · ${Caetano.escapeHtml(p.codigoComercial||p.ean||p.id)} · ${Caetano.money(p.precoVenda||p.custoAtual||0)}</button>`).join(''); document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const p=Caetano.col('products').get(b.dataset.p); const id=Caetano.uid(); cart.push({id,produtoId:p.id,nome:p.nome,qtd:1,preco:Caetano.num(p.precoVenda||p.custoAtual||0),total:Caetano.num(p.precoVenda||p.custoAtual||0)});q.value='';results.innerHTML='';draw()})}; finalizar.onclick=()=>{if(!cart.length)return Caetano.toast('Carrinho vazio.'); CaetanoPDV.saleCreate(cart,{nome:cliente.value},{forma:forma.value}); cart=[];draw();Caetano.toast('Venda registrada.');}; draw();});</script></body></html>
