<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Superadmin — thIAguinho Açougues</title><link rel="stylesheet" href="css/style.css"><script src="js/firebase-config.js"></script><script src="js/core.js"></script></head><body><div class="wrap"><div class="screen-title"><div class="brand"><div class="logo">T</div><div><h1>Superadmin thIAguinho</h1><p>Cadastro de açougues, módulos, Cloudinary e auditoria global.</p></div></div><div class="actions"><button class="btn" onclick="Caetano.logout()">Sair</button></div></div><div class="grid"><div class="card span-4"><h2>Novo açougue</h2><div class="field"><label>Nome</label><input id="tNome" value="Caetano Carnes e Rotisseria"></div><div class="field"><label>Tenant ID</label><input id="tId" value="caetano"></div><div class="field"><label>Responsável</label><input id="tResp"></div><div class="field"><label>E-mail admin</label><input id="tEmail" type="email" value="admin@caetano.com.br"></div><div class="field"><label>Cloudinary cloudName</label><input id="tCloud"></div><div class="field"><label>Upload preset unsigned</label><input id="tPreset"></div><button class="btn primary" onclick="criarTenant()">Criar açougue + JSONs</button><button class="btn" onclick="baixarTenantJson()">Baixar JSON do tenant</button></div><div class="card span-8"><h2>Açougues cadastrados</h2><div id="listaTenants"></div></div><div class="card span-12"><h2>Auditoria global/local</h2><div id="auditoria"></div></div></div></div><div id="toast" class="toast"></div><script>const S=Caetano.requireRole(['superadmin']);function criarTenant(){let t=Caetano.criarTenantCompleto({id:tId.value,nome:tNome.value,responsavel:tResp.value,emailAdmin:tEmail.value,cloudName:tCloud.value,uploadPreset:tPreset.value});Caetano.toast('Açougue criado com estrutura automática.');render()}function baixarTenantJson(){let t=Caetano.tenant(tId.value||'caetano');if(!t)return Caetano.toast('Tenant não encontrado');let blob=new Blob([JSON.stringify(t,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=t.id+'_tenant.json';a.click()}function render(){let ts=Object.values(Caetano.read('tenants',{}));listaTenants.innerHTML=ts.map(t=>`<div class="card"><b>${t.nome}</b><br><span class="muted">${t.id} · ${t.status} · ${t.plano}</span><p>${Object.entries(t.modulos||{}).map(([k,v])=>`<span class="pill">${k}: ${v?'on':'off'}</span>`).join('')}</p></div>`).join('');let aud=[];ts.forEach(t=>aud.push(...Caetano.read('auditoria_'+t.id,[])));auditoria.innerHTML='<div class="table-wrap"><table><tr><th>Data</th><th>Usuário</th><th>Ação</th><th>Entidade</th><th>Motivo</th></tr>'+aud.slice(0,80).map(a=>`<tr><td>${new Date(a.em).toLocaleString('pt-BR')}</td><td>${a.usuario}</td><td>${a.acao}</td><td>${a.entidade}</td><td>${a.motivo||''}</td></tr>`).join('')+'</table></div>'}render()</script></body></html>
