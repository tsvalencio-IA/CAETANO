<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Superadmin thIAguinho</title><link rel="stylesheet" href="css/style.css"><script src="js/firebase-config.js"></script><script src="js/core.js"></script></head><body><div class="wrap"><div class="top"><div class="brand"><div class="logo">S</div><div><h1>Superadmin thIAguinho</h1><p>Cadastro e controle de açougues/rotisserias no SaaS.</p></div></div><button class="btn bad" onclick="Caetano.logout()">Sair</button></div><div class="nav"><a class="active">Açougues</a><a onclick="show('users')">Usuários</a><a onclick="show('audit')">Auditoria</a></div><section id="sec-main"><div class="grid"><div class="card span-4"><h2>Novo/editar açougue</h2><input id="tid" type="hidden"><div class="field"><label>Nome do açougue</label><input id="tnome" value="Caetano Carnes e Rotisseria"></div><div class="field"><label>Tenant ID</label><input id="tenantId" value="caetano"></div><div class="field"><label>Status</label><select id="status"><option>ativo</option><option>bloqueado</option></select></div><h3>Módulos</h3><div id="mods"></div><button class="btn primary" onclick="saveTenant()">Salvar açougue</button></div><div class="card span-8"><h2>Açougues cadastrados</h2><div class="scroll"><table><thead><tr><th>Nome</th><th>ID</th><th>Status</th><th>Módulos</th><th>Ações</th></tr></thead><tbody id="tbTenants"></tbody></table></div></div></div></section><section id="sec-users" class="hidden"><div class="grid"><div class="card span-4"><h2>Usuário</h2><div class="field"><label>Nome</label><input id="unome"></div><div class="field"><label>E-mail</label><input id="uemail" type="email"></div><div class="field"><label>Senha</label><input id="usenha"></div><div class="field"><label>Perfil</label><select id="urole"><option>admin</option><option>pdv</option><option>balcao</option><option>cozinha</option><option>estoque</option><option>cliente</option></select></div><div class="field"><label>Açougue</label><input id="utenant" value="caetano"></div><button class="btn primary" onclick="saveUser()">Salvar usuário</button></div><div class="card span-8"><h2>Usuários</h2><table><tbody id="tbUsers"></tbody></table></div></div></section><section id="sec-audit" class="hidden"><div class="card"><h2>Auditoria global</h2><table><tbody id="tbAudit"></tbody></table></div></section><div class="footer">Powered by thIAguinho Soluções</div></div><script>const s=Caetano.requireRole(['superadmin']);const mods=document.getElementById('mods');function init(){mods.innerHTML=Object.keys(Caetano.modules).map(k=>`<label class="pill"><input type="checkbox" data-mod="${k}" checked> ${k}</label>`).join('');render()}function show(x){document.querySelectorAll('section').forEach(e=>e.classList.add('hidden'));document.getElementById('sec-'+x).classList.remove('hidden');render()}function saveTenant(){const m={};document.querySelectorAll('[data-mod]').forEach(c=>m[c.dataset.mod]=c.checked);let t={id:tenantId.value.trim(),nome:tnome.value,status:status.value,plano:'pro',modulos:m};Caetano.upsert('tenants',t);render();Caetano.toast('Açougue salvo')}function editTenant(id){const t=Caetano.list('tenants').find(x=>x.id===id);tenantId.value=t.id;tnome.value=t.nome;status.value=t.status;document.querySelectorAll('[data-mod]').forEach(c=>c.checked=!!t.modulos?.[c.dataset.mod])}function saveUser(){Caetano.upsert('users',{nome:unome.value,email:uemail.value,senha:usenha.value,role:urole.value,tenantId:utenant.value,ativo:true});render();Caetano.toast('Usuário salvo')}function render(){tbTenants.innerHTML=Caetano.list('tenants').map(t=>`<tr><td>${Caetano.esc(t.nome)}</td><td>${t.id}</td><td>${t.status}</td><td>${Object.keys(t.modulos||{}).filter(k=>t.modulos[k]).length}</td><td><button class="btn small" onclick="editTenant('${t.id}')">Editar</button></td></tr>`).join('');tbUsers.innerHTML=Caetano.list('users').map(u=>`<tr><td>${u.nome}<br><small>${u.email}</small></td><td>${u.role}</td><td>${u.tenantId}</td></tr>`).join('');tbAudit.innerHTML=Caetano.list('auditoria').slice(0,80).map(a=>`<tr><td>${new Date(a.em).toLocaleString('pt-BR')}</td><td>${a.usuario}</td><td>${a.acao}</td><td>${a.entidade}</td><td>${a.motivo||''}</td></tr>`).join('')}init();</script><div id="toast" class="toast"></div></body></html>
