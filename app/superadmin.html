<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Superadmin — CAETANO</title><link rel="stylesheet" href="css/style.css"><script src="js/firebase-config.js"></script><script src="js/core.js"></script><script src="js/page.js"></script></head><body><script>
document.addEventListener('DOMContentLoaded',()=>{Caetano.requireRole(['superadmin']); const t=Caetano.col('tenants').get('caetano'); CaetanoPage.shell('admin','Superadmin — Módulos da unidade',`<div class="card"><div class="card-h"><h3>Caetano Carnes e Rotisseria</h3><button class="btn ok" id="salvar">Salvar módulos</button></div><div class="card-b"><div class="grid cols-3" id="mods"></div></div></div><div class="card"><div class="card-h"><h3>Auditoria</h3></div><div class="card-b"><table class="table"><thead><tr><th>Data</th><th>Ação</th><th>Usuário</th><th>Motivo</th></tr></thead><tbody id="aud"></tbody></table></div></div>`); const keys=['pdv','estoque','cozinha','nfe','financeiro','etiquetas','clientes','fornecedores','auditoria','relatorios','perdas','producao','encomendas']; mods.innerHTML=keys.map(k=>`<label class="card" style="padding:12px"><input type="checkbox" data-mod="${k}" ${t.modules?.[k]!==false?'checked':''}> ${k}</label>`).join(''); salvar.onclick=()=>{const modules={};document.querySelectorAll('[data-mod]').forEach(i=>modules[i.dataset.mod]=i.checked);Caetano.col('tenants').set('caetano',{modules});Caetano.toast('Módulos salvos.');}; Caetano.renderRows(aud,Caetano.col('audit').all().reverse().slice(0,100),[{label:'Data',html:r=>Caetano.fmtDate(r.createdAt)},{label:'Ação',key:'acao'},{label:'Usuário',key:'usuario'},{label:'Motivo',key:'motivo'}]);});</script></body></html>
